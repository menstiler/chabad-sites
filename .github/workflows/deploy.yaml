name: Deploy to S3

on:
  push:
    branches:
      - main # Change if your branch is 'master' or something else

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Node (skip if not JS app)
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Build project
        run: |
          npm install
          npm run build

      - name: Deploy to S3
        uses: aws-actions/s3-sync@v2
        with:
          bucket: menstiler-static-site # change to your bucket name
          region: us-east-1 # your bucket region
          source-dir: build # adjust to your build output folder (e.g. dist)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

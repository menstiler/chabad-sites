name: Deploy to S3 (Split Buckets)

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # --- Deploy index.html + styles.css to menstiler.com ---
      - name: Sync root files to menstiler.com
        run: |
          aws s3 cp index.html s3://menstiler.com/ --region us-east-1
          aws s3 cp styles.css s3://menstiler.com/ --region us-east-1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      # --- Deploy /assets folder to assets.menstiler.com ---
      - name: Sync assets to assets.menstiler.com
        run: |
          aws s3 sync ./assets s3://assets.menstiler.com/assets --delete --region us-east-1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      # --- Invalidate CloudFront (menstiler.com) ---
      - name: Invalidate CloudFront cache (menstiler.com)
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html" "/styles.css"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      # --- Invalidate CloudFront (assets.menstiler.com) ---
      - name: Invalidate CloudFront cache (assets.menstiler.com)
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_ASSETS_DISTRIBUTION_ID }} \
            --paths "/assets/*"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
